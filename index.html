<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B1A24" />
    <meta name="color-scheme" content="light" />

    <!-- Mirrors the CSP header of server/server.ts (frame-ancestors is not supported in <meta>). The API is same-origin; Supabase (auth/DB) is allowed in connect-src and Stripe Checkout (top-level redirect) in form-action. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; base-uri 'self'; form-action 'self' https://checkout.stripe.com"
    />

    <!-- SEO Primário. The site origin in the URLs below must match SITE_URL in src/components/SEOHead.tsx. -->
    <title>MIDFLOW — Crie Posts e Stories Profissionais com IA em Minutos</title>
    <meta
      name="description"
      content="Estúdio de conteúdo com Inteligência Artificial para pequenos e médios negócios. Transforme um briefing curto em posts para feed, sequências de Stories, legendas e hashtags prontos para o Instagram."
    />
    <meta
      name="keywords"
      content="conteúdo para instagram com ia, inteligência artificial para redes sociais, criador de posts, criador de stories, automação instagram para pequenos negócios, social media com ia, midflow"
    />
    <meta name="author" content="MIDFLOW" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="https://voaneves.com/midflow-app/" />

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="MIDFLOW — Crie Posts e Stories Profissionais com IA em Minutos" />
    <meta
      property="og:description"
      content="Transforme um briefing curto em posts para feed, sequências de Stories, legendas e hashtags com a cara da sua marca. Teste grátis sem cartão de crédito."
    />
    <meta property="og:url" content="https://voaneves.com/midflow-app/" />
    <meta property="og:site_name" content="MIDFLOW" />
    <meta property="og:image" content="https://voaneves.com/midflow-app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="MIDFLOW — Estúdio de conteúdo para Instagram" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MIDFLOW — Crie Posts e Stories Profissionais com IA em Minutos" />
    <meta
      name="twitter:description"
      content="Transforme seu briefing em posts, Stories, legendas e hashtags com Inteligência Artificial para pequenas e médias empresas."
    />
    <meta name="twitter:image" content="https://voaneves.com/midflow-app/og-image.png" />

    <!-- Favicon & PWA -->
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="MIDFLOW" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Preload da fonte principal para Core Web Vitals otimizados -->
    <link
      rel="preload"
      href="/src/assets/fonts/plus-jakarta-sans-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- JSON-LD Estruturado (Schema.org) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://voaneves.com/midflow-app/#organization",
            "name": "MIDFLOW",
            "url": "https://voaneves.com/midflow-app",
            "logo": "https://voaneves.com/midflow-app/icons/icon-512.png",
            "sameAs": ["https://instagram.com/midflow.app"],
            "description": "Estúdio de conteúdo com Inteligência Artificial para pequenas e médias empresas."
          },
          {
            "@type": "SoftwareApplication",
            "@id": "https://voaneves.com/midflow-app/#software",
            "name": "MIDFLOW App",
            "applicationCategory": "BusinessApplication",
            "operatingSystem": "All",
            "url": "https://voaneves.com/midflow-app",
            "offers": [
              {
                "@type": "Offer",
                "name": "Plano Start",
                "price": "47.00",
                "priceCurrency": "BRL"
              },
              {
                "@type": "Offer",
                "name": "Plano Pro",
                "price": "77.00",
                "priceCurrency": "BRL"
              },
              {
                "@type": "Offer",
                "name": "Plano Business",

                "priceCurrency": "BRL"
              }
            ]
          },
          {
            "@type": "WebSite",
            "@id": "https://voaneves.com/midflow-app/#website",
            "url": "https://voaneves.com/midflow-app",
            "name": "MIDFLOW",
            "publisher": { "@id": "https://voaneves.com/midflow-app/#organization" },
            "inLanguage": "pt-BR"
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
