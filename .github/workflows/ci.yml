# Checks pull requests (main is checked by deploy.yml): lint + type-check + tests + build + performance budget.
name: CI

on:
  pull_request:

# Runs JavaScript actions that still target Node 20 on Node 24 (Node 20 is deprecated on runners).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run check:budget
