# One push to main publishes everything:
#
#   1. checks  → lint, tests, type-check
#   2. api     → Cloudflare Worker "midflow-api" at https://voaneves.com/midflow-app/api/*
#                The AI keys live ONLY here, as Worker secrets copied from GitHub Secrets.
#   3. site    → GitHub Pages (voaneves.com/midflow-app). The build contains NO keys;
#                it just calls /midflow-app/api on the same domain.
#
# GitHub → Settings → Secrets and variables → Actions → Secrets (one-time):
#   CLOUDFLARE_API_TOKEN   token to deploy the Worker (template "Edit Cloudflare Workers")
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare account ID (also used for Workers AI images)
#   GEMINI_API_KEY         Google AI Studio key — text
#   CF_AI_TOKEN            Cloudflare token with "Workers AI" permission — images
#   ADMIN_TOKEN            any long random string — protects /api/admin/metrics
#
# Without CLOUDFLARE_API_TOKEN the api job is skipped (with a warning) and the site
# still deploys; it then runs as an offline demo, clearly labeled in the app.
name: Deploy (API on Cloudflare + site on GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run typecheck

  api:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Check Cloudflare credentials
        id: cf
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN not set — API not deployed; the site will run as an offline demo."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.cf.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.cf.outputs.ready == 'true'
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: steps.cf.outputs.ready == 'true'

      - name: Deploy Worker + secrets
        if: steps.cf.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          # Names only; values come from env below and are stored encrypted in Cloudflare.
          secrets: |
            GEMINI_API_KEY
            CF_AI_ACCOUNT_ID
            CF_AI_TOKEN
            ADMIN_TOKEN
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CF_AI_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_AI_TOKEN: ${{ secrets.CF_AI_TOKEN }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}

      - name: Smoke test
        if: steps.cf.outputs.ready == 'true'
        # Cloudflare's bot protection often answers 403 to datacenter IPs (like GitHub's runners),
        # so a 403 here is a warning, not a failure. Real visitors are not affected.
        run: |
          sleep 5
          code=$(curl -s -o status.json -w '%{http_code}' https://voaneves.com/midflow-app/api/status)
          if [ "$code" = "403" ]; then
            echo "::warning::Smoke test blocked by Cloudflare bot protection (403). Check manually: https://voaneves.com/midflow-app/api/status"
          elif [ "$code" != "200" ]; then
            echo "::error::API answered HTTP $code"; cat status.json; exit 1
          elif grep -q '"aiEnabled":true' status.json; then
            echo "::notice::API online with AI enabled."; cat status.json
          else
            echo "::warning::API is up but AI is off — check the GEMINI_API_KEY secret."; cat status.json
          fi

  site:
    needs: checks
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Build
        env:
          # Same-origin path of the API (the Worker route). Not a secret.
          VITE_API_URL: /midflow-app
        run: npm run build

      # Hash routing → every path works; 404.html covers direct hits on unknown paths.
      - run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
